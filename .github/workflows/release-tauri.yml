name: Release (Tauri)

# Builda a casca nativa Tauri para Windows, macOS (universal) e Linux e publica
# um GitHub Release com os instaladores + o manifesto assinado do updater
# (latest.json), usado pelo tauri-plugin-updater em runtime (ver
# src-tauri/tauri.conf.json > plugins.updater.endpoints).
#
# Dispara em push de tag "v*" (ex.: v0.2.0) ou manualmente via Actions.
# O release é criado como RASCUNHO (draft) — fica invisível pro updater e
# pros usuários até alguém revisar os artefatos e publicá-lo manualmente.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: instalar dependências de sistema (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: cache do cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: dependências do frontend
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        id: tauri_action
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'MRQ Multitracks Play v__VERSION__'
          releaseBody: |
            Primeira versão da casca nativa em Tauri (substitui o Electron).

            **Importante:** esta versão requer macOS 10.15 (Catalina) ou mais
            recente, Windows 7+, ou Linux com WebKitGTK. Quem usa macOS
            10.12–10.14 (Sierra/High Sierra/Mojave) deve continuar na última
            versão em Electron (v0.1.18).
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: listar bundles gerados (diagnóstico, só roda se a action acima falhou)
        if: steps.tauri_action.outcome == 'failure'
        shell: bash
        run: |
          find src-tauri/target -type d -iname bundle -exec find {} -type f \; 2>&1 || true
          exit 1

