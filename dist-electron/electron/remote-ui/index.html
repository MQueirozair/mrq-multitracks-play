<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>MRQ Remoto</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    background: #0b0b0d; color: #eceef1; min-height: 100vh; padding: 16px;
  }
  h1 { font-size: 18px; letter-spacing: .08em; text-transform: uppercase; color: #f2a93b; margin: 0 0 4px; }
  .sub { color: #8c8f98; font-size: 13px; margin-bottom: 16px; }
  .card { background: #16171b; border: 1px solid #26272e; border-radius: 14px; padding: 14px; margin-bottom: 14px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  button { font-family: inherit; }
  .big-btn {
    border: none; border-radius: 12px; padding: 18px; font-size: 15px; font-weight: 600;
    color: #fff; background: #26272e; cursor: pointer;
  }
  .big-btn:active { filter: brightness(1.3); }
  .transport { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
  .transport .play { background: #f2a93b; color: #1a1300; }
  .parts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .part-btn { background: #23324a; text-align: left; position: relative; }
  .part-btn.active { background: #f2a93b; color: #1a1300; box-shadow: 0 0 0 2px #fff4; }
  .stepper { display: flex; align-items: center; gap: 10px; }
  .stepper button { width: 40px; height: 40px; border-radius: 10px; border: 1px solid #333; background: #1d1e24; color: #eceef1; font-size: 18px; }
  .pin-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 80vh; gap: 16px; }
  .pin-input { font-size: 28px; letter-spacing: .3em; text-align: center; width: 180px; background: #16171b; border: 1px solid #333; color: #fff; border-radius: 10px; padding: 10px; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #3cd06c; display: inline-block; margin-right: 6px; }
  .status-dot.off { background: #666; }
</style>
</head>
<body>
  <div id="pinScreen" class="pin-screen">
    <h1>MRQ · Multitracks Play</h1>
    <div class="sub">Digite o PIN mostrado no computador</div>
    <input id="pinInput" class="pin-input" inputmode="numeric" maxlength="6" placeholder="----" />
    <button class="big-btn transport-play" id="pinSubmit" style="background:#f2a93b;color:#1a1300;width:180px;">Entrar</button>
    <div id="pinError" style="color:#e06565;font-size:13px;"></div>
  </div>

  <div id="mainScreen" style="display:none">
    <h1>MRQ · Multitracks Play</h1>
    <div class="sub"><span id="statusDot" class="status-dot off"></span><span id="songTitle">Nenhuma música</span></div>

    <div class="card">
      <div class="row">
        <div class="stepper">
          <span style="color:#8c8f98;font-size:12px;">TOM</span>
          <span id="keyLabel" style="font-weight:700;font-size:18px;">-</span>
        </div>
        <div class="stepper">
          <span style="color:#8c8f98;font-size:12px;">BPM</span>
          <span id="bpmLabel" style="font-weight:700;font-size:18px;">-</span>
        </div>
      </div>
    </div>

    <div class="transport">
      <button class="big-btn" id="btnStop">■ Parar</button>
      <button class="big-btn play" id="btnPlay">▶ Tocar</button>
      <button class="big-btn" id="btnLoop">🔁 Loop</button>
    </div>

    <div class="parts" id="partsGrid"></div>
  </div>

<script>
  const pinScreen = document.getElementById('pinScreen');
  const mainScreen = document.getElementById('mainScreen');
  const pinInput = document.getElementById('pinInput');
  const pinError = document.getElementById('pinError');
  let pin = sessionStorage.getItem('mrq-pin') || '';
  let ws = null;
  let authed = false;

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}/ws`);
    ws.onopen = () => { if (pin) ws.send(JSON.stringify({ type: 'auth', pin })); };
    ws.onmessage = (ev) => {
      const msg = JSON.parse(ev.data);
      if (msg.type === 'auth') {
        if (msg.ok) {
          authed = true;
          sessionStorage.setItem('mrq-pin', pin);
          pinScreen.style.display = 'none';
          mainScreen.style.display = 'block';
        } else {
          pinError.textContent = 'PIN incorreto';
        }
      } else if (msg.type === 'state') {
        renderState(msg.payload);
      }
    };
    ws.onclose = () => {
      document.getElementById('statusDot').classList.add('off');
      setTimeout(connect, 1500);
    };
  }

  function send(payload) {
    if (ws && ws.readyState === ws.OPEN) ws.send(JSON.stringify({ type: 'command', pin, payload }));
  }

  let lastIsPlaying = false;
  function renderState(state) {
    lastIsPlaying = !!state.isPlaying;
    document.getElementById('statusDot').classList.remove('off');
    document.getElementById('songTitle').textContent = state.songTitle || 'Nenhuma música';
    document.getElementById('keyLabel').textContent = state.currentKey || '-';
    document.getElementById('bpmLabel').textContent = state.currentBpm || '-';
    document.getElementById('btnPlay').textContent = state.isPlaying ? '⏸ Pausar' : '▶ Tocar';
    const grid = document.getElementById('partsGrid');
    grid.innerHTML = '';
    (state.parts || []).forEach((p) => {
      const btn = document.createElement('button');
      btn.className = 'big-btn part-btn' + (p.id === state.activePartId ? ' active' : '');
      btn.textContent = `${p.index}. ${p.name}`;
      btn.onclick = () => send({ type: 'jumpToPart', partId: p.id });
      grid.appendChild(btn);
    });
  }

  document.getElementById('pinSubmit').onclick = () => {
    pin = pinInput.value.trim();
    if (!ws) connect();
    else if (ws.readyState === ws.OPEN) ws.send(JSON.stringify({ type: 'auth', pin }));
  };
  document.getElementById('btnPlay').onclick = () => send({ type: lastIsPlaying ? 'pause' : 'play' });
  document.getElementById('btnStop').onclick = () => send({ type: 'stop' });
  document.getElementById('btnLoop').onclick = () => send({ type: 'toggleLoop' });

  connect();
</script>
</body>
</html>
