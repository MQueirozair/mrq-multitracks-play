[package]
name = "mrq-multitracks-play"
version = "0.2.12"
description = "MRQ - Multitracks Play: tocador de multitracks ao vivo para banda/culto."
authors = ["MRQ"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "mrq_multitracks_play_lib"
crate-type = ["staticlib", "cdylib", "lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-midi = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["fs"] }
futures-util = "0.3"
mime_guess = "2"
if-addrs = "0.13"

[features]
# Permite rodar sem o bundle de produção durante o dev, usando o dev-server do Vite.
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
# Sandbox de build com pouca RAM: debuginfo completo (nível 2) faz o rustc
# consumir >1GB por crate grande (ex: gtk-rs) e derruba o processo por OOM.
# debug=0 reduz drasticamente o pico de memória durante a compilação.
debug = 0

